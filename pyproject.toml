[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapt-zero-shot"
version = "0.1.0"
description = "Zero-shot MAPT/Tau missense variant prioritization atlas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MAPT Zero-Shot Project" }]
dependencies = []

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "numpy>=1.26", "pandas>=2.1", "seaborn>=0.13"]
esm = ["torch", "fair-esm"]
test = ["pytest>=8"]

[project.scripts]
mapt-zero-shot = "mapt_zero_shot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

